  /commissions/{commissionId}/departments/{orgUnitId}/assessee-candidates:
    parameters:
      - $ref: "#/components/parameters/CommissionId"
      - $ref: "#/components/parameters/OrgUnitId"
    get:
      summary: Кандидаты и оцениваемые подразделения
      description: |
        Строки вкладки «Оцениваемые» для одного подразделения КК (FR-A07):
        - сотрудники подразделения из `OrgStructure`, отфильтрованные по грейдам КК;
          фильтр снять нельзя (решение 01.11);
        - плюс уже включённые оцениваемые этого подразделения, в том числе добавленные вручную
          с другим грейдом или из другого подразделения.

        Кандидатов с выключенным переключателем сервис не хранит: список строится на лету.
        Грейд, звено и стаж берутся из `OrgStructure` при каждом запросе, ФИО — из `PersonProfile`.
        Сортировка — по ФИО. Подразделение должно быть выбрано в КК, иначе `404`.
      operationId: listAssesseeCandidates
      tags: [Assessees]
      x-slice: add-draft-assessees
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        '200':
          description: Страница кандидатов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssesseeCandidatePage"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/DepartmentNotFound"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"

  /commissions/{commissionId}/departments/{orgUnitId}/assessees:
    parameters:
      - $ref: "#/components/parameters/CommissionId"
      - $ref: "#/components/parameters/OrgUnitId"
    post:
      summary: Включить оцениваемого
      description: |
        Включает переключатель у сотрудника (FR-A08) или добавляет сотрудника вручную (FR-A09).

        Обычное включение (`isManual: false`, change D9):
        - сотрудник должен быть в этом подразделении и подходить под грейды КК, иначе
          `422 PERSON_NOT_ELIGIBLE` — человека с другим грейдом добавляют только вручную;
        - причина рассмотрения обязательна в ALPHA, в BETA и GAMMA — нет.

        Ручное добавление (`isManual: true`, change D10):
        - сотрудник ищется по всей компании (`GET /people/search`), фильтры не применяются;
        - попадает в это подразделение сразу включённым с признаком «добавлен»;
        - причина рассмотрения обязательна в любом типе.

        Человек попадает в КК не больше одного раза: если он уже есть в любом подразделении
        этой КК — `409 ASSESSEE_ALREADY_INCLUDED`. Только в `DRAFT`. В активной КК состав
        меняется только через заявку (фаза B).
      operationId: includeAssessee
      tags: [Assessees]
      x-slice: add-draft-assessees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssesseeInclusionRequest"
            examples:
              fromStructure:
                summary: Включение из списка подразделения
                value:
                  personId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  inclusionReason: "Стаж в роли больше пяти лет, кандидат на ротацию"
              manual:
                summary: Ручное добавление (с change D10)
                value:
                  personId: "9b2e4c1a-0d3f-4a7b-8e6c-5f1d2a3b4c5d"
                  inclusionReason: "Предложен руководителем блока"
                  isManual: true
      responses:
        '201':
          description: Оцениваемый включён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssesseeMutationResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/DepartmentNotFound"
        '409':
          description: "КК не в `DRAFT` или человек уже есть в этой КК"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notDraft:
                  value:
                    error:
                      code: COMMISSION_NOT_DRAFT
                      message: "Состав черновика можно менять только в черновике"
                alreadyIncluded:
                  value:
                    error:
                      code: ASSESSEE_ALREADY_INCLUDED
                      message: "Сотрудник уже есть в этой комиссии"
        '422':
          description: "Не заполнена обязательная причина или сотрудник не подходит под фильтры"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                reasonRequired:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: "Укажите причину рассмотрения"
                      fields: [inclusionReason]
                notEligible:
                  value:
                    error:
                      code: PERSON_NOT_ELIGIBLE
                      message: "Сотрудник не подходит под подразделение или грейды. Добавьте его вручную"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"

  /commissions/{commissionId}/assessees/{assesseeId}:
    parameters:
      - $ref: "#/components/parameters/CommissionId"
      - $ref: "#/components/parameters/AssesseeId"
    patch:
      summary: Изменить причину рассмотрения
      description: |
        Правка причины (FR-A08). Автора у причины нет — меняются только аудит-поля строки.
        В ALPHA и для добавленных вручную очистить причину нельзя — `422`. Только в `DRAFT`.
      operationId: updateAssesseeReason
      tags: [Assessees]
      x-slice: add-draft-assessees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssesseeReasonPatch"
      responses:
        '200':
          description: Причина сохранена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssesseeMutationResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/AssesseeNotFound"
        '409':
          $ref: "#/components/responses/CommissionNotDraft"
        '422':
          $ref: "#/components/responses/ValidationFailed"
    delete:
      summary: Исключить оцениваемого из черновика
      description: |
        Выключение переключателя или удаление добавленного вручную (FR-A08, FR-A09).
        Строка удаляется вместе с причиной; при повторном включении причину вводят заново.
        Предупреждение перед удалением добавленного вручную показывает клиент.

        Только в `DRAFT`, иначе `409`: в активной КК исключают через заявку `EXCLUDE` (фаза B).
      operationId: excludeAssesseeFromDraft
      tags: [Assessees]
      x-slice: add-draft-assessees
      responses:
        '200':
          description: Оцениваемый исключён; ответ — актуальная заполненность
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletenessResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/AssesseeNotFound"
        '409':
          $ref: "#/components/responses/CommissionNotDraft"

  /people/search:
    get:
      summary: Поиск сотрудника по ФИО
      description: |
        Поиск по всей компании для ручного добавления оцениваемого (FR-A09) и выдачи доступа
        владельцу комиссии (FR-A13). Ищет `PersonProfilePort` по подстроке ФИО, подразделение
        и грейд найденного добавляются из `OrgStructure`. Выдача ограничена `limit`.

        Доступно владельцам процесса и (с change 14) владельцам комиссии. Если `PersonProfile`
        недоступен — `503`: искать без ФИО нечем.
      operationId: searchPeople
      tags: [People]
      x-slice: add-manual-assessee
      parameters:
        - name: query
          in: query
          required: true
          description: "Подстрока ФИО, не короче трёх символов"
          schema:
            type: string
            minLength: 3
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Найденные сотрудники
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonSearchResult"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '422':
          $ref: "#/components/responses/ValidationFailed"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"

  /decision-templates:
    get:
      summary: Список шаблонов проектов решений
      description: |
        Шаблоны — общий ресурс всех владельцев процесса (FR-A05). По умолчанию архивные
        не возвращаются: при выборе шаблона в КК они не предлагаются (с change C7).
        Читать список могут владельцы процесса и (с change 14) владельцы комиссии.
      operationId: listDecisionTemplates
      tags: [DecisionTemplates]
      x-slice: add-decision-templates
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Шаблоны
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DecisionTemplateSummary"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
    post:
      summary: Создать шаблон
      description: |
        Создаёт шаблон; варианты и поля контекста можно передать сразу или добавить потом.
        Создают и правят шаблоны владельцы процесса. Могут ли это делать владельцы комиссии,
        уточняется у бизнеса.
      operationId: createDecisionTemplate
      tags: [DecisionTemplates]
      x-slice: add-decision-templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionTemplateCreateRequest"
            example:
              name: "Альфа 2027"
              options:
                - name: "Ротация"
                - name: "Развитие в роли"
                - name: "Развитие компетенции Disrupt"
              contextFields:
                - name: "Сильные стороны"
                  isRequired: true
                - name: "Зоны развития"
                  isRequired: false
      responses:
        '201':
          description: Шаблон создан
          headers:
            Location:
              description: "URL шаблона"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionTemplate"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '422':
          $ref: "#/components/responses/ValidationFailed"

