openapi: 3.0.3
info:
  title: "Кадровые комиссии — фаза A"
  description: |
    Контракт сервиса «Кадровые комиссии» для фазы A — «Создание и запуск КК».
    Срез 1 (`add-commission-draft-core`) — исходный фрагмент. Остальные операции добавлены
    по нарезке фазы A, у каждой в `x-slice` указан change, в котором она появляется.
    Proposal каждого change берёт из этого файла свои операции и схемы.

    | Change | Что добавляет в API |
    | --- | --- |
    | 1 `add-commission-draft-core` | `POST /commissions`, `GET` и `PATCH /commissions/{commissionId}` |
    | 2 `add-commission-list` | `GET /commissions`, `DELETE /commissions/{commissionId}` |
    | A3 `add-commission-grades` | `GET /grades`, поле `gradeCodes` в параметрах |
    | A4 `add-commission-departments` | `GET /org-units`, выбор и снятие подразделений КК |
    | B5 `add-commission-stages` | этапы КК и их порядок |
    | C6 `add-decision-templates` | шаблоны проектов решений, варианты, поля контекста |
    | C8 `add-commission-template-binding` | поле `decisionTemplateId` в параметрах |
    | D9 `add-draft-assessees` | кандидаты подразделения, включение, правка причины, исключение |
    | 14 `add-commission-owners` | владельцы комиссии; доступ к остальным операциям расширяется |
    | 15 `add-directories-admin` | `/admin/process-owners`, `/admin/hrd-assignments` |
    | C7 `add-decision-template-copy-archive` | копия и архив шаблона |
    | D10 `add-manual-assessee` | `GET /people/search`, ручное добавление оцениваемого |
    | 13 `add-commission-clone` | `POST /commissions/{commissionId}/clone` |
    | 11 `add-commission-activation` | `POST /commissions/{commissionId}/activation` |
    | 12 `add-activation-events` | в API ничего не добавляет: outbox и события внутренние |

    Общие правила:
    - Все эндпоинты требуют JWT. `person_id` берётся из токена библиотекой авторизации.
    - Роль проверяется на каждой операции, иначе `403 ACCESS_DENIED`, ничего не меняется.
      - Владелец процесса — активная запись в `process_owner`. Видит и правит все КК.
      - Владелец комиссии (с change 14) — запись в `commission_owner` для этой КК.
        Внутри неё может всё, что владелец процесса, кроме создания КК и «Создать на основе».
      - Роль поддержки (change 15) — роль из библиотеки авторизации, только `/admin/*`.
    - Ресурс не существует — `404` с кодом `*_NOT_FOUND`.
    - Правка черновика вне статуса `DRAFT` — `409 COMMISSION_NOT_DRAFT`.
    - Недопустимое значение — `422 VALIDATION_FAILED`, ничего не меняется. Поля-нарушители — в `fields`.
    - Конфликт с инвариантом домена — `409` с отдельным кодом, ничего не меняется.
    - `OrgStructure` или система грейдов недоступны — `503 EXTERNAL_SERVICE_UNAVAILABLE`.
      `PersonProfile` недоступен — ответ приходит без ФИО, с `personProfileAvailable: false`.
    - Все правки черновика возвращают актуальную КК с заполненностью, кроме оцениваемых:
      их операции возвращают оцениваемого и заполненность, потому что список может быть большим.
    - Даты — ISO-8601: `date-time` в UTC, `date` — календарная дата. `personId` — UUID из `PersonProfile`,
      `orgUnitId` — UUID из `OrgStructure`.
    - Лимиты длины строк — предложение. Окончательные значения фиксирует design.md своего change.
  version: 0.2.0

tags:
  - name: Commission
    description: "Кадровая комиссия: черновик, список, удаление, активация, копирование"
  - name: Grades
    description: "Справочник грейдов (внешняя система)"
  - name: Departments
    description: "Подразделения комиссии и кандидаты из `OrgStructure`"
  - name: Stages
    description: "Этапы проведения"
  - name: Assessees
    description: "Оцениваемые и причина рассмотрения"
  - name: People
    description: "Поиск сотрудников (`PersonProfile`)"
  - name: DecisionTemplates
    description: "Шаблоны проектов решений"
  - name: Owners
    description: "Владельцы комиссии («Настроить доступ»)"
  - name: Admin
    description: "Справочники для роли поддержки"

paths:
  /commissions:
    get:
      summary: Список комиссий
      description: |
        Главная (FR-A01). Владелец процесса видит все КК всех владельцев. Владелец комиссии
        (с change 14) видит только КК, к которым ему выдан доступ. Остальным — пустой список.

        Сортировка — по дате создания, новые сверху. КК без названия приходит с `title: null`,
        а «Без названия» подставляет клиент. Фильтр по срокам появится позже.
      operationId: listCommissions
      tags: [Commission]
      x-slice: add-commission-list
      parameters:
        - name: type
          in: query
          description: "Фильтр по типу; можно передать несколько значений"
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CommissionTypeValue"
        - name: status
          in: query
          description: "Фильтр по статусу; можно передать несколько значений"
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CommissionStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionListPage"
        '401':
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Создать черновик комиссии
      description: |
        Создаёт КК в статусе `DRAFT` вместе с первым изменением формы (FR-A02).

        «+» в интерфейсе открывает пустую форму и запрос не отправляет — клиент вызывает эндпоинт
        только после первого изменения. Id присваивает сервер.

        Тело — объект первого изменения: `null`, пустой массив или отсутствующее поле означают
        «не задано». Хотя бы одно поле должно быть задано, иначе `422`. Какие поля доступны,
        зависит от change: в срезе 1 — `title`, `regulation`, `type`; дальше каждый срез, который
        добавляет данные черновика, добавляет и своё поле первого изменения (см. схему).

        В одной транзакции пишутся строка `personnel_commission`, переход `null → DRAFT`
        в `commission_status_history` и дочерние строки первого изменения (подразделение или этап).
        `created_by` и `updated_by` равны автору — `person_id` из токена.

        Создавать КК может только владелец процесса, в том числе после change 14.

        Защиты от повторного `POST` нет (решение 02.11): клиент не повторяет запрос, а случайный
        дубль на обрыве связи владелец удалит сам. Пока `POST` не ответил, клиент держит следующие
        правки в очереди и после `201` отправляет их отдельными запросами.
      operationId: createCommissionDraft
      tags: [Commission]
      x-slice: add-commission-draft-core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionDraftRequest"
            examples:
              firstTitle:
                summary: Первое изменение — название
                value:
                  title: "Центральный аппарат"
              firstType:
                summary: Первое изменение — тип
                value:
                  type: ALPHA
              firstDepartment:
                summary: Первое изменение — подразделение (с change A4)
                value:
                  departmentOrgUnitIds: ["7f1c2b8e-3a0d-4f6e-9b1a-2c5d8e9f0a11"]
              firstStage:
                summary: Первое изменение — этап (с change B5)
                value:
                  stages:
                    - title: "Подготовка списков"
      responses:
        '201':
          description: Черновик создан
          headers:
            Location:
              description: "URL созданного ресурса, `/commissions/{commissionId}`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '422':
          $ref: "#/components/responses/ValidationFailed"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"

  /commissions/{commissionId}:
    parameters:
      - $ref: "#/components/parameters/CommissionId"

    get:
      summary: Получить комиссию
      description: |
        Открытие КК. Отдаёт статус, параметры проведения, автора с ФИО, даты создания
        и последнего изменения, подразделения (с change A4), этапы (с change B5)
        и заполненность мастера.

        В черновике название, руководитель и HRD подразделения берутся из `OrgStructure`
        и `HrdResolver` при каждом запросе. После активации (change 11) — из снимка.

        ФИО запрашиваются у `PersonProfilePort` пакетом. Если профиль недоступен, КК всё равно
        открывается: у людей `fullName: null`, а в ответе `personProfileAvailable: false`.

        Оцениваемые в ответ не входят — они загружаются по подразделению.
      operationId: getCommission
      tags: [Commission]
      x-slice: add-commission-draft-core
      responses:
        '200':
          description: Комиссия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/CommissionNotFound"

    patch:
      summary: Автосохранение параметров проведения
      description: |
        Частичная правка параметров проведения черновика. Сохраняются только переданные поля;
        `null` в теле означает «очистить поле», отсутствие поля — «не трогать».

        Поля по change: `title`, `regulation`, `type` — срез 1; `gradeCodes` — A3;
        `decisionTemplateId` — C8.

        Правка допустима только в `DRAFT`, иначе `409`. Значение проверяет агрегат:
        - тип — только `ALPHA` / `BETA` / `GAMMA`, `title` ≤ 200 символов, `regulation` ≤ 4000;
        - `gradeCodes` — только коды из системы грейдов, без повторов;
        - `decisionTemplateId` — существующий шаблон не в архиве.

        Нарушение — `422`, черновик не меняется.

        `updated_by` и `updated_at` обновляются автоматически. Оптимистической блокировки нет:
        при одновременных правках одного поля сохраняется последнее изменение (last-write-wins).

        Очистка всех полей не удаляет КК: она остаётся черновиком с `complete: false`.
        Если убрать грейд, уже включённые оцениваемые не меняются: грейды — фильтр, а не ограничение.
      operationId: updateCommissionParams
      tags: [Commission]
      x-slice: add-commission-draft-core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionParamsPatch"
            examples:
              renameDraft:
                summary: Правка названия
                value:
                  title: "Центральный аппарат — ротации"
              clearType:
                summary: Очистка типа
                value:
                  type: null
              setGrades:
                summary: Выбор грейдов (с change A3)
                value:
                  gradeCodes: ["G14", "G15"]
              bindTemplate:
                summary: Выбор шаблона (с change C8)
                value:
                  decisionTemplateId: "1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed"
      responses:
        '200':
          description: Правка сохранена, ответ — актуальная заполненность и параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/CommissionNotFound"
        '409':
          $ref: "#/components/responses/CommissionNotDraft"
        '422':
          $ref: "#/components/responses/ValidationFailed"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"

    delete:
      summary: Удалить черновик
      description: |
        Физическое удаление черновика вместе со всеми дочерними строками (FR-A14):
        подразделениями, этапами, оцениваемыми, историей статусов, владельцами комиссии.
        Шаблон проектов решений не удаляется — удаляется только привязка.

        Удалить можно только КК в `DRAFT`, иначе `409`. Удаляют владелец процесса
        и (с change 14) владелец этой комиссии.
      operationId: deleteCommissionDraft
      tags: [Commission]
      x-slice: add-commission-list
      responses:
        '204':
          description: Черновик удалён
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/CommissionNotFound"
        '409':
          $ref: "#/components/responses/CommissionNotDraft"

  /commissions/{commissionId}/activation:
    parameters:
      - $ref: "#/components/parameters/CommissionId"
    post:
      summary: Активировать комиссию («Создать»)
      description: |
        Переводит КК из `DRAFT` в `ACTIVE` (FR-A10, FR-A11, FR-X04). В одной транзакции:
        - агрегат проверяет все правила заполненности — при нарушении `422 COMMISSION_INCOMPLETE`
          с заполненностью в `details.completeness`;
        - проверяет тип — в MVP активируется только `ALPHA`, иначе `422 COMMISSION_TYPE_NOT_ACTIVATABLE`;
        - фиксирует снимок каждого подразделения: название, руководитель, HRD через `HrdResolver`,
          `snapshotAt`; привязка оцениваемых к подразделениям фиксируется, атрибуты людей — нет (ADR-0001);
        - ставит подразделениям статус `NOT_FILLED`;
        - пишет переход `DRAFT → ACTIVE` в историю статусов;
        - привязанный шаблон становится используемым: правка и удаление шаблона дальше дают `409`;
        - с change 12 — кладёт события «КК активирована» в outbox, по одному на подразделение.

        После активации параметры проведения, подразделения и этапы не меняются (`409`).
        Активируют владелец процесса и (с change 14) владелец этой комиссии.
      operationId: activateCommission
      tags: [Commission]
      x-slice: add-commission-activation
      responses:
        '200':
          description: КК активирована, ответ — КК со снимком подразделений
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/CommissionNotFound"
        '409':
          $ref: "#/components/responses/CommissionNotDraft"
        '422':
          description: |
            КК нельзя активировать: не заполнены обязательные поля (`COMMISSION_INCOMPLETE`)
            или тип не `ALPHA` (`COMMISSION_TYPE_NOT_ACTIVATABLE`). Ничего не меняется.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                incomplete:
                  summary: Не заполнены этапы
                  value:
                    error:
                      code: COMMISSION_INCOMPLETE
                      message: "Заполните обязательные поля перед созданием комиссии"
                      details:
                        completeness:
                          complete: false
                          sections:
                            - id: stages
                              complete: false
                              requiredFields: [fullyFilledStages]
                              missingFields: [fullyFilledStages]
                typeNotActivatable:
                  summary: Тип не ALPHA
                  value:
                    error:
                      code: COMMISSION_TYPE_NOT_ACTIVATABLE
                      message: "В текущей версии можно запустить только комиссию типа ALPHA"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"

  /commissions/{commissionId}/clone:
    parameters:
      - $ref: "#/components/parameters/CommissionId"
    post:
      summary: Создать на основе
      description: |
        Создаёт новый черновик по существующей КК в любом статусе (FR-A12). Копия сразу появляется
        в `DRAFT`: правило «КК появляется при первом изменении» к ней не относится.

        Копируются: название с префиксом «Копия — », регламент, тип, грейды, подразделения
        по `orgUnitId`, этапы без дат, ссылка на шаблон, если он не в архиве.
        Не копируются: оцениваемые, владельцы комиссии, снимок подразделений.
        Подразделения, которых больше нет в `OrgStructure`, приходят с `available: false`.
        Исходная КК не меняется.

        Доступно только владельцам процесса.
      operationId: cloneCommission
      tags: [Commission]
      x-slice: add-commission-clone
      responses:
        '201':
          description: Копия создана
          headers:
            Location:
              description: "URL новой КК"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/CommissionNotFound"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"

  /grades:
    get:
      summary: Справочник грейдов
      description: |
        Грейды из внешней системы через `GradeCatalogPort`, в порядке сортировки справочника.
        Доступно владельцам процесса и (с change 14) владельцам комиссии.
      operationId: listGrades
      tags: [Grades]
      x-slice: add-commission-grades
      responses:
        '200':
          description: Грейды
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Grade"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"

  /org-units:
    get:
      summary: Подразделения-кандидаты для КК
      description: |
        Подразделения верхнего уровня из `OrgStructure` с руководителем и HRD (FR-A04).
        Вызывается и до создания КК, поэтому не привязан к `commissionId`: какие из них выбраны,
        клиент видит по `departments` в КК.

        HRD есть у каждого подразделения: его определяет `HrdResolver`. Если HRD не найден,
        это ошибка данных справочника, а не доменный сценарий — `500 INTERNAL_ERROR`.
      operationId: listOrgUnitCandidates
      tags: [Departments]
      x-slice: add-commission-departments
      parameters:
        - name: level
          in: query
          required: false
          description: "Уровень оргструктуры. В альфе — только верхний"
          schema:
            type: string
            enum: [TOP]
            default: TOP
      responses:
        '200':
          description: Подразделения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitCandidateList"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"

  /commissions/{commissionId}/departments/{orgUnitId}:
    parameters:
      - $ref: "#/components/parameters/CommissionId"
      - $ref: "#/components/parameters/OrgUnitId"
    put:
      summary: Выбрать подразделение
      description: |
        Отмечает подразделение в черновике (FR-A04). Операция идемпотентна: повторная отметка
        не создаёт дубль и отвечает `200` с тем же состоянием. В черновике хранится только
        `orgUnitId`; название, руководитель и HRD берутся из структуры при показе.

        Подразделение должно существовать в `OrgStructure` и быть верхнего уровня, иначе `422`.
        Только в `DRAFT`, иначе `409`.
      operationId: selectCommissionDepartment
      tags: [Departments]
      x-slice: add-commission-departments
      responses:
        '200':
          description: Подразделение выбрано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/CommissionNotFound"
        '409':
          $ref: "#/components/responses/CommissionNotDraft"
        '422':
          $ref: "#/components/responses/ValidationFailed"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"
    delete:
      summary: Снять подразделение
      description: |
        Снимает отметку и удаляет подразделение из черновика. Подразделение, которого больше нет
        в структуре (`available: false`), снять тоже можно.

        С change D9: если в подразделении есть оцениваемые, снять его нельзя —
        `409 DEPARTMENT_HAS_ASSESSEES`; сначала оцениваемых нужно исключить
        (решение 01.11, уточняется у бизнеса).

        Только в `DRAFT`, иначе `409 COMMISSION_NOT_DRAFT`. Если подразделение не выбрано — `404`.
      operationId: unselectCommissionDepartment
      tags: [Departments]
      x-slice: add-commission-departments
      responses:
        '200':
          description: Подразделение снято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/DepartmentNotFound"
        '409':
          description: "КК не в `DRAFT` или в подразделении есть оцениваемые"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notDraft:
                  value:
                    error:
                      code: COMMISSION_NOT_DRAFT
                      message: "Параметры проведения можно менять только в черновике"
                hasAssessees:
                  value:
                    error:
                      code: DEPARTMENT_HAS_ASSESSEES
                      message: "Сначала исключите оцениваемых этого подразделения"

  /commissions/{commissionId}/stages:
    parameters:
