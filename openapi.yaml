        '404':
          $ref: "#/components/responses/CommissionNotFound"
        '409':
          $ref: "#/components/responses/CommissionNotDraft"
        '422':
          $ref: "#/components/responses/ValidationFailed"

  /commissions/{commissionId}/stages/{stageId}:
    parameters:
