      - $ref: "#/components/parameters/StageId"
    patch:
      summary: Изменить этап
      description: |
        Частичная правка этапа: отсутствующее поле не меняется, `null` очищает поле.
        После правки `dateFrom` не позже `dateTo`, иначе `422`. Только в `DRAFT`.
      operationId: updateCommissionStage
      tags: [Stages]
      x-slice: add-commission-stages
      requestBody:
