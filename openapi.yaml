          description: Шаблон сохранён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionTemplate"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/TemplateNotFound"
        '409':
          $ref: "#/components/responses/TemplateLocked"
        '422':
          $ref: "#/components/responses/ValidationFailed"
    delete:
      summary: Удалить шаблон
      description: |
        Удалить можно только шаблон, не привязанный ни к одной КК. С change C8 привязанный
        шаблон даёт `409 TEMPLATE_ATTACHED`; используемый шаблон можно только архивировать (C7).
      operationId: deleteDecisionTemplate
      tags: [DecisionTemplates]
      x-slice: add-decision-templates
      responses:
        '204':
          description: Шаблон удалён
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
