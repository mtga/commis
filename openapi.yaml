              schema:
                $ref: "#/components/schemas/DecisionTemplate"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/TemplateNotFound"
        '409':
          $ref: "#/components/responses/TemplateLocked"

  /decision-templates/{templateId}/context-fields:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    post:
      summary: Добавить поле контекста
      description: "Поле добавляется в конец списка. Ограничения шаблона — как у переименования."
      operationId: addContextField
      tags: [DecisionTemplates]
      x-slice: add-decision-templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextFieldInput"
      responses:
        '201':
          description: Поле добавлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionTemplate"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/TemplateNotFound"
        '409':
          $ref: "#/components/responses/TemplateLocked"
        '422':
          $ref: "#/components/responses/ValidationFailed"

  /decision-templates/{templateId}/context-fields/order:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    put:
      summary: Изменить порядок полей контекста
      description: "В `ids` — все поля шаблона ровно по одному разу, иначе `422`."
      operationId: reorderContextFields
      tags: [DecisionTemplates]
      x-slice: add-decision-templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdOrder"
      responses:
        '200':
          description: Порядок сохранён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionTemplate"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/TemplateNotFound"
        '409':
          $ref: "#/components/responses/TemplateLocked"
        '422':
          $ref: "#/components/responses/ValidationFailed"

  /decision-templates/{templateId}/context-fields/{fieldId}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
      - $ref: "#/components/parameters/FieldId"
    patch:
      summary: Изменить поле контекста
      description: "Частичная правка: название и обязательность."
      operationId: updateContextField
      tags: [DecisionTemplates]
      x-slice: add-decision-templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextFieldPatch"
      responses:
        '200':
          description: Поле сохранено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionTemplate"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/TemplateNotFound"
        '409':
          $ref: "#/components/responses/TemplateLocked"
        '422':
          $ref: "#/components/responses/ValidationFailed"
    delete:
      summary: Удалить поле контекста
      operationId: deleteContextField
      tags: [DecisionTemplates]
      x-slice: add-decision-templates
      responses:
        '200':
          description: Поле удалено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionTemplate"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/TemplateNotFound"
        '409':
          $ref: "#/components/responses/TemplateLocked"

  /decision-templates/{templateId}/copy:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    post:
      summary: Создать копию шаблона
      description: |
        Новый шаблон «<имя> (копия)» с теми же вариантами и полями контекста, не привязанный
        ни к одной КК. Так меняют используемый шаблон. Копировать можно и архивный.
        Не путать с «Создать на основе» для КК.
      operationId: copyDecisionTemplate
      tags: [DecisionTemplates]
      x-slice: add-decision-template-copy-archive
      responses:
        '201':
          description: Копия создана
          headers:
            Location:
              description: "URL копии"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionTemplate"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/TemplateNotFound"

  /decision-templates/{templateId}/archive:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    post:
      summary: Архивировать шаблон
      description: |
        Архивный шаблон не предлагается при выборе в КК, но остаётся виден в КК, к которым
        уже привязан, и не копируется при «Создать на основе». Повторная архивация не ошибка.
        Обратного действия в MVP нет.
      operationId: archiveDecisionTemplate
      tags: [DecisionTemplates]
      x-slice: add-decision-template-copy-archive
      responses:
        '200':
          description: Шаблон в архиве
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionTemplate"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/TemplateNotFound"

  /commissions/{commissionId}/owners:
    parameters:
      - $ref: "#/components/parameters/CommissionId"
    get:
      summary: Владельцы комиссии
      description: "Активные владельцы этой КК с ФИО. Владельцы процесса в список не входят."
      operationId: listCommissionOwners
      tags: [Owners]
      x-slice: add-commission-owners
      responses:
        '200':
          description: Владельцы комиссии
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionOwner"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/CommissionNotFound"
    post:
      summary: Выдать доступ к комиссии
      description: |
        «Настроить доступ» (FR-A13): сотрудник становится владельцем этой КК. Выдают владелец
        процесса и владелец этой КК, в любом статусе КК. Сотрудника выбирают через
        `GET /people/search`. Если доступ уже выдан — `409 OWNER_ALREADY_GRANTED`.
      operationId: grantCommissionOwner
      tags: [Owners]
      x-slice: add-commission-owners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionOwnerGrantRequest"
      responses:
        '201':
          description: Доступ выдан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionOwner"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/CommissionNotFound"
        '409':
          description: "Доступ этому сотруднику уже выдан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: OWNER_ALREADY_GRANTED
                  message: "У сотрудника уже есть доступ к этой комиссии"
        '422':
          $ref: "#/components/responses/ValidationFailed"

  /commissions/{commissionId}/owners/{personId}:
    parameters:
      - $ref: "#/components/parameters/CommissionId"
      - $ref: "#/components/parameters/PersonId"
    delete:
      summary: Отозвать доступ к комиссии
      description: |
        Мягкий отзыв: в `commission_owner` ставится `revoked_at`, `updated_by` — кто отозвал.
        Доступ плоский: отозвать можно у любого владельца комиссии, в том числе у того, кто выдал,
        и у себя. Доступ владельцев процесса идёт от роли и здесь не отзывается — для них `404`.
      operationId: revokeCommissionOwner
      tags: [Owners]
      x-slice: add-commission-owners
      responses:
        '204':
          description: Доступ отозван
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/OwnerNotFound"

  /admin/process-owners:
    get:
      summary: Справочник владельцев процесса
      description: "Все записи, включая неактивные. Только роль поддержки."
      operationId: listProcessOwners
      tags: [Admin]
      x-slice: add-directories-admin
      responses:
        '200':
          description: Владельцы процесса
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessOwner"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
    post:
      summary: Добавить владельца процесса
      description: |
        Добавленный сразу получает права. Если человек уже есть в справочнике (даже неактивный) —
        `409 PROCESS_OWNER_ALREADY_EXISTS`; неактивного включают через `PATCH`.
      operationId: addProcessOwner
      tags: [Admin]
      x-slice: add-directories-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessOwnerCreateRequest"
      responses:
        '201':
          description: Владелец процесса добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessOwner"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '409':
          description: "Человек уже есть в справочнике"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: PROCESS_OWNER_ALREADY_EXISTS
                  message: "Сотрудник уже есть в справочнике владельцев процесса"
        '422':
          $ref: "#/components/responses/ValidationFailed"

  /admin/process-owners/{processOwnerId}:
    parameters:
      - name: processOwnerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Изменить владельца процесса
      description: "Деактивация (`isActive: false`) сразу отнимает права; включение возвращает."
      operationId: updateProcessOwner
      tags: [Admin]
      x-slice: add-directories-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessOwnerPatch"
      responses:
        '200':
          description: Запись сохранена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessOwner"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/DirectoryEntryNotFound"
        '422':
          $ref: "#/components/responses/ValidationFailed"

  /admin/hrd-assignments:
    get:
      summary: Справочник связок HRD ↔ подразделение
      description: "Все записи. Можно отфильтровать по подразделению или по HRD. Только роль поддержки."
      operationId: listHrdAssignments
      tags: [Admin]
      x-slice: add-directories-admin
      parameters:
        - name: orgUnitId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: hrdPersonId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Связки
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HrdAssignment"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
    post:
      summary: Добавить связку
      description: |
        `orgUnitId` проверяется через `OrgStructurePort`, иначе `422`. `validTo: null` — бессрочно.
      operationId: addHrdAssignment
      tags: [Admin]
      x-slice: add-directories-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrdAssignmentCreateRequest"
      responses:
        '201':
          description: Связка добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HrdAssignment"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '422':
          $ref: "#/components/responses/ValidationFailed"
        '503':
          $ref: "#/components/responses/ExternalServiceUnavailable"

  /admin/hrd-assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Изменить сроки связки
      description: |
        Меняются только сроки; чтобы сменить HRD, закрывают старую связку и добавляют новую.
        Изменения не влияют на уже активированные КК: HRD там зафиксирован в снимке.
      operationId: updateHrdAssignment
      tags: [Admin]
      x-slice: add-directories-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrdAssignmentPatch"
      responses:
        '200':
          description: Связка сохранена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HrdAssignment"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/AccessDenied"
        '404':
          $ref: "#/components/responses/DirectoryEntryNotFound"
        '422':
          $ref: "#/components/responses/ValidationFailed"

components:
  parameters:
    CommissionId:
      name: commissionId
      in: path
      required: true
      description: Идентификатор КК, присвоенный сервером
      schema:
        type: string
        format: uuid
    OrgUnitId:
      name: orgUnitId
      in: path
      required: true
      description: "UUID подразделения в `OrgStructure`"
      schema:
        type: string
        format: uuid
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssesseeId:
      name: assesseeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OptionId:
      name: optionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      description: "UUID человека в `PersonProfile`"
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: "Номер страницы, с нуля"
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    # ---------- Комиссия ----------
    CommissionDraftRequest:
      type: object
      description: |
        Первое изменение формы. Все поля необязательные, `null` или пустой массив — «не задано».
        Хотя бы одно поле должно быть задано. Поля появляются по change: `title`, `regulation`,
        `type` — срез 1; `gradeCodes` — A3; `departmentOrgUnitIds` — A4; `stages` — B5;
        `decisionTemplateId` — C8. Проверки — те же, что у соответствующих правок.
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
          maxLength: 200
          description: "Название КК. Очищенное или пустое название считается незаданным"
        regulation:
          type: string
          nullable: true
          maxLength: 4000
          description: "Регламент проведения"
        type:
          $ref: "#/components/schemas/CommissionType"
        gradeCodes:
          type: array
          nullable: true
          uniqueItems: true
          items:
            type: string
          description: "Коды грейдов из системы грейдов (change A3)"
        departmentOrgUnitIds:
          type: array
          nullable: true
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: "Выбранные подразделения верхнего уровня (change A4)"
        stages:
          type: array
          nullable: true
          maxItems: 1
          items:
            $ref: "#/components/schemas/StageInput"
          description: "Первый этап (change B5). Первым изменением может быть только один этап"
        decisionTemplateId:
          type: string
          format: uuid
          nullable: true
          description: "Шаблон проектов решений (change C8)"
      example:
        title: "Центральный аппарат"

    CommissionParamsPatch:
      type: object
      description: |
        Частичная правка. Отсутствующее поле не меняется, `null` очищает поле.
        Отправка тела без полей допустима и не меняет черновик.
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
          maxLength: 200
        regulation:
          type: string
          nullable: true
          maxLength: 4000
        type:
          $ref: "#/components/schemas/CommissionType"
        gradeCodes:
          type: array
          nullable: true
          uniqueItems: true
          items:
            type: string
          description: "Список целиком; `null` или `[]` — грейды не выбраны (change A3)"
        decisionTemplateId:
          type: string
          format: uuid
          nullable: true
          description: "Привязать шаблон; `null` — снять выбор (change C8)"

    CommissionTypeValue:
      type: string
      enum:
        - ALPHA
        - BETA
        - GAMMA

    CommissionType:
      type: string
      nullable: true
      description: |
        Тип КК; `null` — не задан. В черновике допустим любой тип; ограничение
        «активировать только ALPHA» появляется вместе с активацией (задачка 11).
      enum:
        - ALPHA
        - BETA
        - GAMMA

    CommissionStatus:
      type: string
      description: "Статус КК. В фазе A КК бывает в `DRAFT` и `ACTIVE`; `COMPLETED` — после встречи"
      enum:
        - DRAFT
        - ACTIVE
        - COMPLETED

    CommissionResponse:
      type: object
      required: [commissionId, status, params, author, createdAt, updatedAt, completeness]
      properties:
        commissionId:
          type: string
          format: uuid
          description: "Идентификатор КК (в базе — `id`)"
        status:
          $ref: "#/components/schemas/CommissionStatus"
        params:
          $ref: "#/components/schemas/CommissionParams"
        author:
          allOf:
            - $ref: "#/components/schemas/PersonRef"
          description: "Автор КК (`created_by`)"
        createdAt:
          type: string
          format: date-time
          description: "Дата создания"
        updatedAt:
          type: string
          format: date-time
          description: "Дата последнего изменения"
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: "Дата активации из истории статусов; `null` для черновика (change 11)"
        departments:
          type: array
          description: "Выбранные подразделения (change A4). До A4 — пустой массив"
          items:
            $ref: "#/components/schemas/CommissionDepartment"
        stages:
          type: array
          description: "Этапы в заданном порядке (change B5). До B5 — пустой массив"
          items:
            $ref: "#/components/schemas/Stage"
        completeness:
          $ref: "#/components/schemas/Completeness"
        personProfileAvailable:
          type: boolean
          default: true
          description: |
            `false`, если `PersonProfile` недоступен. Тогда у людей приходит только `personId`,
            а `fullName` — `null`. Признак относится к запросу ответа, а не к самим людям:
            клиент показывает `personId` вместо ФИО.

    CommissionParams:
      type: object
      description: "Параметры проведения комиссии. Значение-объект агрегата"
      required: [title, regulation, type]
      properties:
        title:
          type: string
          nullable: true
          description: "Название; `null` — не задано"
        regulation:
          type: string
          nullable: true
          description: "Регламент; `null` — не задан. Необязателен для заполненности"
        type:
          $ref: "#/components/schemas/CommissionType"
        gradeCodes:
          type: array
          description: "Коды выбранных грейдов (change A3). Названия — из `GET /grades`"
          items:
            type: string
        decisionTemplate:
          allOf:
            - $ref: "#/components/schemas/DecisionTemplateRef"
          nullable: true
          description: "Привязанный шаблон; `null` — не выбран (change C8)"

    CommissionListPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommissionListItem"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          description: "Всего КК под фильтром"
        personProfileAvailable:
          type: boolean
          default: true

    CommissionListItem:
      type: object
      required: [commissionId, title, type, status, author, createdAt, updatedAt]
      properties:
        commissionId:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          description: "`null` — без названия; подпись «Без названия» подставляет клиент"
        type:
          $ref: "#/components/schemas/CommissionType"
        status:
          $ref: "#/components/schemas/CommissionStatus"
        author:
          $ref: "#/components/schemas/PersonRef"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        accessHolders:
          type: array
          description: "Владельцы этой КК — колонка «у кого есть доступ» (change 14)"
          items:
            $ref: "#/components/schemas/PersonRef"

    # ---------- Грейды ----------
    Grade:
      type: object
      required: [code, name, sortOrder]
      properties:
        code:
          type: string
          example: G14
        name:
          type: string
          example: "14 грейд"
        sortOrder:
          type: integer

    # ---------- Подразделения ----------
    OrgUnitCandidateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnitCandidate"
        personProfileAvailable:
          type: boolean
          default: true

    OrgUnitCandidate:
      type: object
      required: [orgUnitId, name, head, hrd]
      properties:
        orgUnitId:
          type: string
          format: uuid
        name:
          type: string
        head:
          allOf:
            - $ref: "#/components/schemas/PersonRef"
          description: "Руководитель подразделения из `OrgStructure`"
        hrd:
          allOf:
            - $ref: "#/components/schemas/PersonRef"
          description: "HRD через `HrdResolver`; есть у каждого подразделения"

    CommissionDepartment:
      type: object
      description: |
        Подразделение комиссии. В черновике `name`, `head` и `hrd` берутся из структуры при показе,
        после активации — из снимка (`snapshotAt` заполнен).
      required: [departmentId, orgUnitId, available]
      properties:
        departmentId:
          type: string
          format: uuid
          description: "Идентификатор строки подразделения комиссии"
        orgUnitId:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: "`null`, если подразделения больше нет в структуре"
        head:
          allOf:
            - $ref: "#/components/schemas/PersonRef"
          nullable: true
        hrd:
          allOf:
            - $ref: "#/components/schemas/PersonRef"
          nullable: true
        available:
          type: boolean
          description: |
            `false` — подразделения больше нет в `OrgStructure`. Только для черновика:
            клиент показывает пометку «недоступно», такое подразделение можно снять.
        assesseeCount:
          type: integer
          description: "Число оцениваемых (change D9)"
        status:
          allOf:
            - $ref: "#/components/schemas/DepartmentStatus"
          nullable: true
          description: "`null` в черновике; после активации — статус подразделения (change 11)"
        snapshotAt:
          type: string
          format: date-time
          nullable: true
          description: "Момент снимка; `null` в черновике (change 11)"

    DepartmentStatus:
      type: string
      description: "Не заполнено → В процессе → На согласовании → Согласовано. Меняется в фазе B"
      enum:
        - NOT_FILLED
        - IN_PROGRESS
        - ON_APPROVAL
        - APPROVED

    # ---------- Этапы ----------
    StageInput:
      type: object
      description: "Новый этап. Все поля необязательны: частично заполненный этап сохраняется"
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 4000
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true

    StagePatch:
      type: object
      description: "Частичная правка этапа. Отсутствующее поле не меняется, `null` очищает поле"
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 4000
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true

    Stage:
      type: object
      required: [stageId, position, title, description, dateFrom, dateTo, complete]
      properties:
        stageId:
          type: string
          format: uuid
        position:
          type: integer
          description: "Порядковый номер, с нуля"
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true
        complete:
          type: boolean
          description: "Заполнены все четыре поля"

    StageOrder:
      type: object
      required: [stageIds]
      additionalProperties: false
      properties:
        stageIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid

    # ---------- Оцениваемые ----------
    AssesseeCandidatePage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssesseeCandidate"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        personProfileAvailable:
          type: boolean
          default: true

    AssesseeCandidate:
      type: object
      description: |
        Строка вкладки «Оцениваемые». `included: false` — кандидат из структуры, в базе его нет.
        `included: true` — оцениваемый, `assesseeId` и `inclusionReason` заполнены.
      required: [person, included]
      properties:
        person:
          $ref: "#/components/schemas/PersonRef"
        gradeCode:
          type: string
          nullable: true
        gradeName:
          type: string
          nullable: true
        subUnitName:
          type: string
          nullable: true
          description: "Звено на уровень ниже подразделения комиссии"
        tenureInRoleMonths:
          type: integer
          nullable: true
          description: "Стаж в роли, месяцев"
        included:
          type: boolean
        assesseeId:
          type: string
          format: uuid
          nullable: true
        inclusionReason:
          type: string
          nullable: true
        isManual:
          type: boolean
          default: false
          description: "Добавлен вручную — пометка «добавлен» (change D10)"

    AssesseeInclusionRequest:
      type: object
      required: [personId]
      additionalProperties: false
      properties:
        personId:
          type: string
          format: uuid
        inclusionReason:
          type: string
          nullable: true
          maxLength: 4000
          description: "Обязательна в ALPHA и для ручного добавления; в BETA и GAMMA — нет"
        isManual:
          type: boolean
          default: false
          description: "Ручное добавление в обход фильтров (change D10)"

    AssesseeReasonPatch:
      type: object
      required: [inclusionReason]
      additionalProperties: false
      properties:
        inclusionReason:
          type: string
          nullable: true
          maxLength: 4000

    Assessee:
      type: object
      required: [assesseeId, departmentId, orgUnitId, person, inclusionReason, isManual]
      properties:
        assesseeId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        orgUnitId:
          type: string
          format: uuid
        person:
          $ref: "#/components/schemas/PersonRef"
        inclusionReason:
          type: string
          nullable: true
        isManual:
          type: boolean

    AssesseeMutationResponse:
      type: object
      required: [assessee, completeness]
      properties:
        assessee:
          $ref: "#/components/schemas/Assessee"
        completeness:
          $ref: "#/components/schemas/Completeness"
        personProfileAvailable:
          type: boolean
          default: true

    CompletenessResponse:
      type: object
      required: [completeness]
      properties:
        completeness:
          $ref: "#/components/schemas/Completeness"

    # ---------- Люди ----------
    PersonRef:
      type: object
      description: "Ссылка на человека. Персданные в сервисе не хранятся — только `personId`"
      required: [personId]
      properties:
        personId:
          type: string
          format: uuid
          description: "UUID человека в `PersonProfile`"
        fullName:
          type: string
          nullable: true
          description: "ФИО из `PersonProfile`; `null`, если профиль недоступен"

    PersonSearchResult:
      type: object
      required: [person]
      properties:
        person:
          $ref: "#/components/schemas/PersonRef"
        orgUnitName:
          type: string
          nullable: true
          description: "Подразделение из `OrgStructure`"
        gradeName:
          type: string
          nullable: true

    # ---------- Шаблоны ----------
    DecisionTemplateRef:
      type: object
      required: [templateId, name, archived]
      properties:
        templateId:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean

    DecisionTemplateSummary:
      type: object
      required: [templateId, name, archived, inUse, optionCount, contextFieldCount, updatedAt]
      properties:
        templateId:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
          description: "В архиве (change C7)"
        inUse:
          type: boolean
          description: "Используемый: привязан хотя бы к одной КК вне `DRAFT` (change 11)"
        optionCount:
          type: integer
        contextFieldCount:
          type: integer
        author:
          $ref: "#/components/schemas/PersonRef"
        updatedAt:
          type: string
          format: date-time

    DecisionTemplate:
      type: object
      required: [templateId, name, archived, inUse, options, contextFields]
      properties:
        templateId:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
        inUse:
          type: boolean
        options:
          type: array
          description: "Варианты проектов решений в заданном порядке"
          items:
            $ref: "#/components/schemas/DecisionOption"
        contextFields:
          type: array
          description: "Поля контекста в заданном порядке"
          items:
            $ref: "#/components/schemas/ContextField"
        author:
          $ref: "#/components/schemas/PersonRef"
        updatedAt:
          type: string
          format: date-time

    DecisionTemplateCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        options:
          type: array
          items:
            $ref: "#/components/schemas/DecisionOptionInput"
        contextFields:
          type: array
          items:
            $ref: "#/components/schemas/ContextFieldInput"

    DecisionTemplatePatch:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    DecisionOption:
      type: object
      required: [optionId, position, name]
      properties:
        optionId:
          type: string
          format: uuid
        position:
          type: integer
        name:
          type: string

    DecisionOptionInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    ContextField:
      type: object
      required: [fieldId, position, name, isRequired]
      properties:
        fieldId:
          type: string
          format: uuid
        position:
          type: integer
        name:
          type: string
        isRequired:
          type: boolean

    ContextFieldInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        isRequired:
          type: boolean
          default: false

    ContextFieldPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        isRequired:
          type: boolean

    IdOrder:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid

    # ---------- Владельцы комиссии ----------
    CommissionOwner:
      type: object
      required: [person, grantedBy, grantedAt]
      properties:
        person:
          $ref: "#/components/schemas/PersonRef"
        grantedBy:
          allOf:
            - $ref: "#/components/schemas/PersonRef"
          description: "Кто выдал доступ (`created_by`)"
        grantedAt:
          type: string
          format: date-time
          description: "Когда выдан доступ (`created_at`)"

    CommissionOwnerGrantRequest:
      type: object
      required: [personId]
      additionalProperties: false
      properties:
        personId:
          type: string
          format: uuid

    # ---------- Справочники ----------
    ProcessOwner:
      type: object
      required: [processOwnerId, person, team, isActive, createdAt, updatedAt]
      properties:
        processOwnerId:
          type: string
          format: uuid
        person:
          $ref: "#/components/schemas/PersonRef"
        team:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProcessOwnerCreateRequest:
      type: object
      required: [personId]
      additionalProperties: false
      properties:
        personId:
          type: string
          format: uuid
        team:
          type: string
          nullable: true
          maxLength: 200

    ProcessOwnerPatch:
      type: object
      additionalProperties: false
      properties:
        team:
          type: string
          nullable: true
          maxLength: 200
        isActive:
          type: boolean

    HrdAssignment:
      type: object
      required: [assignmentId, orgUnitId, hrd, validFrom, validTo]
      properties:
        assignmentId:
          type: string
          format: uuid
        orgUnitId:
          type: string
          format: uuid
        orgUnitName:
          type: string
          nullable: true
        hrd:
          $ref: "#/components/schemas/PersonRef"
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          nullable: true
          description: "`null` — бессрочно"

    HrdAssignmentCreateRequest:
      type: object
      required: [orgUnitId, hrdPersonId, validFrom]
      additionalProperties: false
      properties:
        orgUnitId:
          type: string
          format: uuid
        hrdPersonId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          nullable: true

    HrdAssignmentPatch:
      type: object
      additionalProperties: false
      properties:
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          nullable: true

    # ---------- Заполненность ----------
    Completeness:
      type: object
      description: |
        Заполненность мастера. Формат расширяемый: срезы добавляют разделы и поля,
        не меняя контракт. Правила по change:
        - `params`: `title`, `type` — срез 1; `gradeCodes` (≥1 грейд) — A3;
          `departments` (≥1 подразделение) — A4; `decisionTemplate` — C8;
        - `stages`: `fullyFilledStages` (≥2 этапа с заполненными всеми полями) — B5;
        - `assessees`: `assesseesPerDepartment` (≥1 оцениваемый в каждом подразделении)
          и в ALPHA `inclusionReason` (причина у каждого включённого) — D9.
      required: [complete, sections]
      properties:
        complete:
          type: boolean
          description: "Все разделы мастера заполнены. «Создать» доступна только при `true`"
        sections:
          type: array
          description: "Заполненность каждого раздела мастера; порядок не важен, раздел ищут по `id`"
          items:
            $ref: "#/components/schemas/SectionCompleteness"

    SectionCompleteness:
      type: object
      required: [id, complete, requiredFields, missingFields]
      properties:
        id:
          type: string
          description: |
            Идентификатор раздела: `params` («Параметры проведения», срез 1),
            `stages` («Этапы», B5), `assessees` («Оцениваемые», D9).
          example: params
        complete:
          type: boolean
          description: "Все обязательные поля раздела заполнены"
        requiredFields:
          type: array
          description: "Какие правила раздела действуют сейчас. Срезы расширяют список"
          items:
            type: string
          example: [title, type]
        missingFields:
          type: array
          description: "Невыполненные правила раздела"
          items:
            type: string
          example: [type]
        items:
          type: array
          description: |
            Детализация по элементам раздела: какие этапы не заполнены полностью (`stages`),
            в каких подразделениях нет оцениваемых или у кого нет причины (`assessees`).
          items:
            $ref: "#/components/schemas/ItemCompleteness"

    ItemCompleteness:
      type: object
      required: [itemId, missingFields]
      properties:
        itemId:
          type: string
          format: uuid
          description: "`stageId`, `departmentId` или `assesseeId`"
        missingFields:
          type: array
          items:
            type: string
          example: [dateTo]

    # ---------- Ошибки ----------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - ACCESS_DENIED
                - VALIDATION_FAILED
                - INTERNAL_ERROR
                - EXTERNAL_SERVICE_UNAVAILABLE
                - COMMISSION_NOT_FOUND
                - COMMISSION_NOT_DRAFT
                - COMMISSION_INCOMPLETE
                - COMMISSION_TYPE_NOT_ACTIVATABLE
                - DEPARTMENT_NOT_FOUND
                - DEPARTMENT_HAS_ASSESSEES
                - STAGE_NOT_FOUND
                - ASSESSEE_NOT_FOUND
                - ASSESSEE_ALREADY_INCLUDED
                - PERSON_NOT_ELIGIBLE
                - TEMPLATE_NOT_FOUND
                - TEMPLATE_ATTACHED
                - TEMPLATE_IN_USE
                - TEMPLATE_ARCHIVED
                - OWNER_NOT_FOUND
                - OWNER_ALREADY_GRANTED
                - DIRECTORY_ENTRY_NOT_FOUND
                - PROCESS_OWNER_ALREADY_EXISTS
              description: |
                Машиночитаемый код. Клиент различает случаи по нему, а не по тексту `message`.
                `VALIDATION_FAILED` покрывает нарушения формата и допустимых значений, а поля-нарушители
                перечислены в `fields`. Доменные конфликты имеют свои коды.
            message:
              type: string
              description: "Текст для отображения пользователю"
            fields:
              type: array
              description: "Поля, из-за которых запрос отклонён (только для `VALIDATION_FAILED`)"
              items:
                type: string
              example: [type]
            details:
              type: object
              description: "Дополнительные данные ошибки, например заполненность для `COMMISSION_INCOMPLETE`"
              additionalProperties: true

  responses:
    Unauthorized:
      description: "JWT отсутствует или недействителен"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: "Требуется авторизация"
    AccessDenied:
      description: |
        У пользователя нет роли для этой операции: он не владелец процесса, не владелец этой КК
        (с change 14) или, для `/admin/*`, у него нет роли поддержки. Ничего не меняется.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: ACCESS_DENIED
              message: "Недостаточно прав для этого действия"
    CommissionNotFound:
      description: "КК с таким идентификатором не существует"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: COMMISSION_NOT_FOUND
              message: "Кадровая комиссия не найдена"
    CommissionNotDraft:
      description: "КК не в статусе `DRAFT`; черновик меняется только до активации"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: COMMISSION_NOT_DRAFT
              message: "Параметры проведения можно менять только в черновике"
    DepartmentNotFound:
      description: "КК не найдена или подразделение не выбрано в этой КК"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: DEPARTMENT_NOT_FOUND
              message: "Подразделение не выбрано в этой комиссии"
    StageNotFound:
      description: "КК или этап не найдены"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: STAGE_NOT_FOUND
              message: "Этап не найден"
    AssesseeNotFound:
      description: "КК или оцениваемый не найдены"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: ASSESSEE_NOT_FOUND
              message: "Оцениваемый не найден"
    TemplateNotFound:
      description: "Шаблон, вариант или поле контекста не найдены"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: TEMPLATE_NOT_FOUND
              message: "Шаблон проектов решений не найден"
    TemplateLocked:
      description: |
        Шаблон нельзя менять или удалять: он используемый (`TEMPLATE_IN_USE`, с change 11),
        привязан к КК (`TEMPLATE_ATTACHED`, только для удаления, с change C8)
        или в архиве (`TEMPLATE_ARCHIVED`, с change C7).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            inUse:
              value:
                error:
                  code: TEMPLATE_IN_USE
                  message: "Шаблон используется в активной комиссии. Создайте копию"
            attached:
              value:
                error:
                  code: TEMPLATE_ATTACHED
                  message: "Шаблон привязан к комиссии и не может быть удалён"
            archived:
              value:
                error:
                  code: TEMPLATE_ARCHIVED
                  message: "Шаблон в архиве"
    OwnerNotFound:
      description: "КК не найдена или у этого сотрудника нет доступа к ней как у владельца комиссии"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: OWNER_NOT_FOUND
              message: "У сотрудника нет доступа к этой комиссии"
    DirectoryEntryNotFound:
      description: "Запись справочника не найдена"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: DIRECTORY_ENTRY_NOT_FOUND
              message: "Запись справочника не найдена"
    ValidationFailed:
      description: "Недопустимое значение; ничего не меняется"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_FAILED
              message: "Недопустимое значение поля"
              fields: [type]
    ExternalServiceUnavailable:
      description: "`OrgStructure`, система грейдов или `PersonProfile` (для поиска) недоступны; ничего не меняется"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: EXTERNAL_SERVICE_UNAVAILABLE
              message: "Сервис оргструктуры временно недоступен"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
