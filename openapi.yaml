    patch:
      summary: Переименовать шаблон
      description: |
        Используемый шаблон (привязан хотя бы к одной КК вне `DRAFT`, с change 11) менять нельзя —
        `409 TEMPLATE_IN_USE`. Архивный тоже — `409 TEMPLATE_ARCHIVED`. Черновики, к которым
